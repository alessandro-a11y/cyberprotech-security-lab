# CyberProtech Web Security Lab — ambiente portátil (Docker Desktop no Windows e Docker/WSL 2).
# Sem dependência de WSL, sem caminhos absolutos: apenas variáveis de ambiente + volumes nomeados.
# Uso padrão:  docker compose up --build
# Encerrar:    docker compose down

name: cyberprotech-security-lab

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cyberprotech_lab}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cyberprotech_lab}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-cyberprotech_lab};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-changeme}
      Frontend__BaseUrl: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-5000}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

  # Toolkit executado sob demanda (não sobe no `up` padrão).
  # Exemplo: docker compose --profile toolkit run --rm toolkit --target http://backend:8080
  toolkit:
    build:
      context: .
      dockerfile: docker/toolkit.Dockerfile
    profiles: ["toolkit"]
    depends_on:
      - backend

volumes:
  pgdata:
