name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build CyberProtech.slnx -c Release
      - run: dotnet test CyberProtech.slnx --no-build -c Release
        if: hashFiles('tests/**/*.csproj') != ''
      # Falha se o modelo EF mudou sem que uma migration fosse gerada.
      - name: migrations em sincronia com o modelo
        working-directory: backend
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes \
            --project Infrastructure --startup-project API

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        if: hashFiles('frontend/package-lock.json') != ''
      - run: npm install
        if: hashFiles('frontend/package-lock.json') == ''
      - run: npm run build

  toolkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r toolkit/requirements.txt
      - run: python -m compileall toolkit/src
